backend:
  name: github
  repo: bencirrus/octabit-work
  branch: main
  base_url: https://octabit-cms-auth.ben-cirrus.workers.dev
  auth_endpoint: /auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Publish Date", name: "pubDate", widget: "datetime" }
      - { label: "Hero Image", name: "heroImage", widget: "image", public_folder: "/images/uploads", media_folder: "public/images/uploads" }
      - { label: "Body", name: "body", widget: "markdown" }
